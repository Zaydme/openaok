# Builds OpenAoK's APK for Android, which needs no game data, and on a version
# tag (v*) adds it to that version's release as OpenAoK-<version>.apk, signed
# with the release key in the repository's secrets.
name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.OPENAOK_KEYSTORE_BASE64 }}
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.31.6'
      - name: SDL and FreeType
        run: android/fetch_deps.sh
      - name: Release key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/openaok.keystore"
          echo "OPENAOK_KEYSTORE=$RUNNER_TEMP/openaok.keystore" >> "$GITHUB_ENV"
      - name: Build
        env:
          OPENAOK_KEYSTORE_PASSWORD: ${{ secrets.OPENAOK_KEYSTORE_PASSWORD }}
          OPENAOK_KEY_ALIAS: ${{ secrets.OPENAOK_KEY_ALIAS }}
          OPENAOK_KEY_PASSWORD: ${{ secrets.OPENAOK_KEY_PASSWORD }}
          OPENAOK_VERSION: ${{ env.VERSION }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --max-workers=4
      - name: Lay out
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/OpenAoK-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAoK-android
          path: dist

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OpenAoK-android
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/publish.sh "dist/OpenAoK-$GITHUB_REF_NAME.apk"
