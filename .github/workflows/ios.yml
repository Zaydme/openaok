# Builds OpenAoK for iOS, which needs no game data: an unsigned OpenAoK.ipa
# for a device, for AltStore to sign and install. On a version tag (v*) adds
# it to that version's release (.github/publish.sh) as OpenAoK-<version>.ipa.
# The compiles' ccache is kept between runs; Xcode's module flags are let
# through it (CCACHE_SLOPPINESS).
name: iOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  ipa:
    runs-on: macos-latest
    env:
      OPENAOK_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      NAME: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
      OPENAOK_CCACHE: '1'
      CCACHE_SLOPPINESS: clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
      CCACHE_DEPEND: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: SDL and FreeType
        run: ios/fetch_deps.sh
      - name: ccache
        run: |
          brew install ccache
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ios-${{ github.sha }}
          restore-keys: ccache-ios-
      - name: Build
        run: |
          ios/build.sh --device --ipa
          ccache -s
      - name: Lay out
        run: |
          mkdir -p dist
          cp ios/build/OpenAoK.ipa "dist/OpenAoK-$NAME.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAoK-ios
          path: dist

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ipa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OpenAoK-ios
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/publish.sh "dist/OpenAoK-$GITHUB_REF_NAME.ipa"
