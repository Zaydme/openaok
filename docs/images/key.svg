<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff1b5"/>
    <stop offset="0.3" stop-color="#f1c463"/>
    <stop offset="0.55" stop-color="#c78f2f"/>
    <stop offset="0.78" stop-color="#f0c868"/>
    <stop offset="1" stop-color="#9a6421"/>
  </linearGradient>
  <filter id="metal" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3.2" result="bump"/>
    <feSpecularLighting in="bump" surfaceScale="5" specularConstant="1.05" specularExponent="26"
                        lighting-color="#fff8e0" result="shine">
      <feDistantLight azimuth="225" elevation="48"/>
    </feSpecularLighting>
    <feComposite in="shine" in2="SourceAlpha" operator="in" result="shineIn"/>
    <feDiffuseLighting in="bump" surfaceScale="5" diffuseConstant="1" lighting-color="#ffffff" result="shade">
      <feDistantLight azimuth="225" elevation="55"/>
    </feDiffuseLighting>
    <feComposite in="SourceGraphic" in2="shade" operator="arithmetic" k1="1.15" k2="0" k3="0" k4="0" result="shaded"/>
    <feComposite in="shaded" in2="SourceAlpha" operator="in" result="body"/>
    <feComposite in="body" in2="shineIn" operator="arithmetic" k1="0" k2="1" k3="0.9" k4="0"/>
  </filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="6" dy="10" stdDeviation="9" flood-color="#000" flood-opacity="0.45"/>
  </filter>
  <radialGradient id="tile" cx="0.5" cy="0.4" r="0.75">
    <stop offset="0" stop-color="#8e1d1a"/>
    <stop offset="1" stop-color="#3a0909"/>
  </radialGradient>
</defs>
